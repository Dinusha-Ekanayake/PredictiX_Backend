# PredictiX knowledge-base source registry.
#
# This file is the source of truth for every document the RAG pipeline may
# load. A source is added, changed or withdrawn only by editing this file in a
# reviewed pull request; `python -m app.kb.pipeline ingest` then brings the
# database in line with it. See kb/README.md for the full process and
# docs/adr/0006-knowledge-base-sources.md for the admission policy.
#
# Admission rules (all must hold):
#   1. Relevant: supports a PredictiX feature (`supports`) for a real user group
#      (`audience`) and covers the fleet (road vehicles, forklifts).
#   2. Authoritative: published by a government body, standards body or a
#      peer-reviewed journal.
#   3. Licensed for reuse, with the licence confirmed in the document itself
#      (`licence_evidence`). An unconfirmed licence means exclusion.
#   4. Honest about jurisdiction: `applicability` says how a foreign rule may be
#      used, so answers never present it as Sri Lankan law.
#
# Audience values match profile roles: user (drivers, technicians, department
# staff), admin (warehouse administrators), super_admin (network managers).
# Scope: `network` applies to every warehouse; `warehouse` lists the warehouse
# codes (LL-COL Colombo, LL-GLE Galle, LL-BDL Badulla) it applies to.

