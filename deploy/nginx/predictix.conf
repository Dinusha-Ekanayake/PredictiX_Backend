# nginx site for the PredictiX API: TLS termination and reverse proxy.
#
#   sudo cp deploy/nginx/predictix.conf /etc/nginx/sites-available/predictix
#   sudo ln -sf /etc/nginx/sites-available/predictix /etc/nginx/sites-enabled/predictix
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace api.example.com with the host name the certificate is issued for
# (for the current instance, 13.232.200.154.sslip.io), then run
#   sudo certbot --nginx -d <host>
# which fills in the certificate paths below and keeps them renewed.

# WebSocket upgrade for realtime notifications (/ws/...): pass the client's
# Upgrade header through, and close the connection otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    # certbot answers its challenge here; everything else goes to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Ticket attachments and report uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Chatbot and report generation wait on LLM calls; WebSockets stay
        # open between notifications (the client reconnects if they drop).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
