[pytest]
# Only these directories hold real pytest tests. Several other files are named
# test_*.py but are standalone scripts that run work on import, so the whole
# tree is not collected.
testpaths =
    app/tests/unit
    app/tests/qa_automated
    app/tests/integration
    app/tests/functional

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: needs a reachable database and the seeded demo accounts
    functional: module-by-module test-plan case, needs the live API and data
    case: carries the test-plan id, title and expected result for reporting

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

addopts = -q --strict-markers

# No single test may hang the run. The functional suite reaches Hugging Face
# Spaces, and the Gradio client bounds the call but not the client
# construction, so an unreachable Space would otherwise block indefinitely.
# Generous enough that a slow-but-working model call still passes.
timeout = 180
timeout_method = thread
