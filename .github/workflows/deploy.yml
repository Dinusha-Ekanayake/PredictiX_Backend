name: Deploy to EC2

# Runs only after CI has passed on main. Deploying straight from a push would
# let a red build reach production.
#
# This exists because the running instance can otherwise drift behind main
# without anyone noticing: its nightly batch keeps writing to the production
# database using whatever code it was last deployed with.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: false
        default: main

# Never run two deployments at once, and never abandon one half-finished.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Attach to a GitHub Environment so production secrets and any required
    # reviewers are enforced by the platform rather than by convention.
    environment:
      name: production
      url: ${{ vars.BACKEND_PUBLIC_URL }}
    # workflow_run fires whatever the outcome, so check it explicitly.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check the production environment is configured
        # Fail with a clear message instead of an SSH error further down.
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          EC2_SERVICE_NAME: ${{ secrets.EC2_SERVICE_NAME }}
        run: |
          missing=()
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_APP_DIR EC2_SERVICE_NAME; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Environment 'production' is missing: ${missing[*]} (see docs/EC2_Deployment.md, section 2)"
            exit 1
          fi

      - name: Resolve what to deploy
        id: target
        # Deploy the exact commit CI tested. A dispatch deploys the tip of the
        # chosen branch. Values reach the remote shell as environment
        # variables, never spliced into the script text.
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if [[ "$EVENT" == "workflow_run" ]]; then
            branch="$RUN_BRANCH"; commit="$RUN_SHA"
          else
            branch="${INPUT_REF:-main}"; commit=""
          fi
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::unsafe ref: $branch"; exit 1; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "deploying ${commit:-tip of $branch} from $branch"

      - name: Deploy over SSH
        # Pinned to the v1.2.5 commit. The host key is checked when
        # EC2_HOST_FINGERPRINT is set (ssh-keyscan the host, then
        # `ssh-keygen -lf`), which is strongly recommended.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          SERVICE: ${{ secrets.EC2_SERVICE_NAME }}
          BRANCH: ${{ steps.target.outputs.branch }}
          COMMIT: ${{ steps.target.outputs.commit }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          command_timeout: 20m
          envs: APP_DIR,SERVICE,BRANCH,COMMIT
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            git fetch --quiet --prune origin "$BRANCH"
            # Run the deploy script from the commit being deployed, so the
            # procedure always matches the code it installs.
            script="$(mktemp)"
            trap 'rm -f "$script"' EXIT
            git show "${COMMIT:-origin/$BRANCH}:scripts/deploy/ec2_deploy.sh" > "$script"
            bash "$script" "$APP_DIR" "$SERVICE" "$BRANCH" "$COMMIT"

      - name: Verify the public endpoint responds
        # The in-host check above proves the process is up; this proves the
        # instance is actually reachable through nginx from outside.
        run: |
          URL="${{ vars.BACKEND_PUBLIC_URL }}"
          if [[ -z "$URL" ]]; then
            echo "BACKEND_PUBLIC_URL is not set; skipping the external check."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$URL" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("models_loaded") is True else 1)'; then
              echo "public endpoint healthy"
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 10
          done
          echo "::error::Public endpoint did not respond after the deploy."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend deployment"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| branch | ${{ steps.target.outputs.branch }} |"
            echo "| commit | \`${{ steps.target.outputs.commit || 'branch tip' }}\` |"
            echo "| result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
