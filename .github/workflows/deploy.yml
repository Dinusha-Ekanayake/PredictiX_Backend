name: Deploy to EC2

# Runs only after CI has passed on main. Deploying straight from a push would
# let a red build reach production.
#
# This exists because the running instance can otherwise drift behind main
# without anyone noticing: its nightly batch keeps writing to the production
# database using whatever code it was last deployed with.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: false
        default: main

# Never run two deployments at once, and never abandon one half-finished.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Attach to a GitHub Environment so production secrets and any required
    # reviewers are enforced by the platform rather than by convention.
    environment:
      name: production
      url: ${{ vars.BACKEND_PUBLIC_URL }}
    # workflow_run fires whatever the outcome, so check it explicitly.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Report what is being deployed
        run: |
          echo "trigger: ${{ github.event_name }}"
          echo "commit:  ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            SERVICE="${{ secrets.EC2_SERVICE_NAME }}"
            BRANCH="${{ github.event.inputs.ref || 'main' }}"

            cd "$APP_DIR"

            # Remember where we were, so a failed rollout can be undone.
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            echo "current commit: $PREVIOUS_SHA"

            git fetch --prune origin
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "deploying commit: $(git rev-parse HEAD)"

            # Install into the same venv systemd runs from.
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            # Fail fast on a syntax error before touching the running service.
            ./venv/bin/python -m compileall -q app

            sudo systemctl restart "$SERVICE"

            # Give it a moment to bind, then require a healthy response.
            # Rolling back here matters: this host runs the nightly batch, so
            # leaving broken code installed would corrupt data overnight.
            sleep 8
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --max-time 10 http://127.0.0.1:8000/ >/dev/null; then
                echo "health check passed on attempt $attempt"
                exit 0
              fi
              echo "health check attempt $attempt failed; retrying"
              sleep 5
            done

            echo "::error::Health check failed. Rolling back to $PREVIOUS_SHA"
            git reset --hard "$PREVIOUS_SHA"
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart "$SERVICE"
            exit 1

      - name: Verify the public endpoint responds
        # The in-host check above proves the process is up; this proves the
        # instance is actually reachable through nginx from outside.
        run: |
          URL="${{ vars.BACKEND_PUBLIC_URL }}"
          if [[ -z "$URL" ]]; then
            echo "BACKEND_PUBLIC_URL is not set; skipping the external check."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$URL" >/dev/null; then
              echo "public endpoint healthy"
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 10
          done
          echo "::error::Public endpoint did not respond after the deploy."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backend deployment"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.event.workflow_run.head_sha || github.sha }}\` |"
            echo "| result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
